spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
springdoc.swagger-ui.path=/doc
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.datasource.hikari.max-lifetime=45000
spring.datasource.hikari.keepalive-time=30000
api.security.token.secret=${JWT_SECRET}
api.security.token.issuer=API PedPen

# Login pelo Google (usuários internos da Citel). Sem o client-id, o POST /Autenticar/google
# responde 422 e o resto da API segue funcionando normalmente.
# O client-id tem de ser o MESMO configurado no front: ele é o audience do ID Token.
api.security.google.client-id=${GOOGLE_CLIENT_ID:}
api.security.google.dominio=${GOOGLE_DOMINIO:citelsoftware.com.br}
server.port=3001